[project]
name = "reaction-game"
version = "0.1.0"
description = "Webcam motion reaction drill: touch hotspots with your hands and feet, tracked by MediaPipe Pose."
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.30",
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reaction-game = "reaction_game.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
